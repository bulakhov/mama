const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
$('total').textContent = fmt(D.duration);
document.querySelector('#title .big').textContent = D.title.big;
document.querySelector('#title .small').textContent = D.title.small;
['I', 'II', 'III', 'IV'].forEach((n, i) => {
  const t = document.createElement('div'); t.className = 'tick';
  t.style.left = (D.bounds[i] / D.duration * 100) + '%'; t.innerHTML = '<span>' + n + '</span>';
  $('track').appendChild(t);
});

// Эффекты по частям симфонии: пылинки (яркость, куда плывут — доля экрана в секунду, цвет),
// leak — сила засветок, pulse — вспышка на акцентах музыки, flicker — дрожание старой плёнки
const FX = {
  1: { dust: .60, dir: [-.003, -.013], tint: '255,237,204', leak: .12, pulse: .11, flicker: .035 },
  2: { dust: .95, dir: [.004, -.017], tint: '255,219,153', leak: .24, pulse: .05, flicker: 0 },
  3: { dust: 1.0, dir: [.011, -.031], tint: '255,230,179', leak: .18, pulse: .10, flicker: 0 },
  4: { dust: .75, dir: [-.003, .015], tint: '235,242,255', leak: .09, pulse: .04, flicker: 0 },
};
const partAt = t => Math.max(1, D.bounds.filter(b => t >= b).length);
const dustCv = $('dust'), dustCx = dustCv.getContext('2d');
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const motes = [];
for (let i = 0; i < 34; i++) motes.push({ x: rnd(), y: rnd(), r: 3 + rnd() * 7, b: .3 + rnd() * .7, near: 1 });
for (let i = 0; i < 80; i++) motes.push({ x: rnd(), y: rnd(), r: 1.3 + rnd() * 2.3, b: .3 + rnd() * .7, near: .5 });
function sizeDust() { dustCv.width = innerWidth; dustCv.height = innerHeight; }
sizeDust(); addEventListener('resize', sizeDust);
function drawDust(t, fx, vis) {
  const W = dustCv.width, H = dustCv.height, u = H / 1080;
  dustCx.clearRect(0, 0, W, H);
  if (vis < .02) return;
  const sway = .009 * Math.sin(t * .35);
  for (const m of motes) {
    const x = (((m.x + (fx.dir[0] * t + sway) * m.near) % 1) + 1) % 1 * W;
    const y = (((m.y + fx.dir[1] * t * m.near) % 1) + 1) % 1 * H;
    const r = m.r * u * 2.2, g = dustCx.createRadialGradient(x, y, 0, x, y, r);
    const a = Math.min(1, m.b * fx.dust * vis * (m.near === 1 ? .5 : .75));
    g.addColorStop(0, 'rgba(' + fx.tint + ',' + a.toFixed(3) + ')'); g.addColorStop(1, 'rgba(' + fx.tint + ',0)');
    dustCx.fillStyle = g; dustCx.beginPath(); dustCx.arc(x, y, r, 0, 6.2832); dustCx.fill();
  }
}

function interp(pts, t) {
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) if (t <= pts[i][0]) {
    const [a, va] = pts[i - 1], [b, vb] = pts[i]; return va + (vb - va) * (t - a) / (b - a);
  }
  return pts[pts.length - 1][1];
}

// Создаёт слой для фото: размытая копия на фон + само фото поверх
function make(s) {
  const el = document.createElement('div'); el.className = 'slide';
  const bg = new Image(), fg = new Image(); bg.className = 'bg'; fg.className = 'fg';
  bg.src = fg.src = s.f; bg.alt = ''; fg.alt = 'Lyuaza Bulakhova (Bekkaeva)';
  fg.onload = () => fit(s, fg);
  el.append(bg, fg); return { el, fg, bg, s };
}
// Фото, близкое по форме к экрану, заполняет его целиком; остальные показываются полностью
function fit(s, fg) {
  if (!fg.naturalWidth) return;
  const r = (fg.naturalWidth / fg.naturalHeight) / (innerWidth / innerHeight);
  const cover = r >= 0.74 && r <= 1.36, fo = s.fo || [0.5, 0.4];
  fg.classList.remove('soft-h', 'soft-v');
  if (cover) {
    Object.assign(fg.style, { left: 0, top: 0, width: '100%', height: '100%', objectFit: 'cover',
      objectPosition: (fo[0] * 100) + '% ' + (fo[1] * 100) + '%' });
  } else {
    // слой фото делаем ровно по размеру картинки, чтобы «таяние» шло от её настоящих краёв
    const k = Math.min(innerWidth / fg.naturalWidth, innerHeight / fg.naturalHeight);
    const w = fg.naturalWidth * k, h = fg.naturalHeight * k;
    Object.assign(fg.style, { left: (innerWidth - w) / 2 + 'px', top: (innerHeight - h) / 2 + 'px',
      width: w + 'px', height: h + 'px', objectFit: 'fill' });
    fg.classList.add(r < 1 ? 'soft-h' : 'soft-v');
  }
  fg.style.transformOrigin = (fo[0] * 100) + '% ' + (fo[1] * 100) + '%';
}
addEventListener('resize', () => live.forEach(v => fit(v.s, v.fg)));

function draw() {
  const t = au.currentTime, fx = FX[partAt(t)];
  let vis = 0, burn = 0, shown = 0;
  D.slides.forEach((s, i) => { if (t >= s.t0 + s.fin && t < s.t1) shown++; });
  D.slides.forEach((s, i) => {
    const near = t >= s.t0 - 4 && t < s.t1;       // подгружаем фото за 4 секунды до показа
    if (!near) { if (live.has(i)) { live.get(i).el.remove(); live.delete(i); } return; }
    if (!live.has(i)) {
      const v = make(s); live.set(i, v);
      const after = [...live.entries()].filter(([k]) => k > i).sort((a, b) => a[0] - b[0])[0];
      stage.insertBefore(v.el, after ? after[1].el : null);
    }
    const v = live.get(i);
    let a = t < s.t0 ? 0 : (s.fin ? Math.min(1, (t - s.t0) / s.fin) : 1);
    // новое фото проявляется мягким кругом из середины предыдущего, а не сменяет его
    const e = a * a * (3 - 2 * a), rad = e * 150;
    // 60% — круг из центра, 40% — ровное проявление по всему кадру, чтобы в начале не было «дырки»
    const mask = a >= 1 ? 'none' : 'radial-gradient(circle farthest-corner at 50% 42%, #000 ' +
      (rad - 46).toFixed(2) + '%, rgba(0,0,0,' + (0.4 * e).toFixed(3) + ') ' + rad.toFixed(2) + '%)';
    v.el.style.webkitMaskImage = mask; v.el.style.maskImage = mask;
    let o = a > 0 ? 1 : 0;
    if (s.fout) { const q = Math.max(0, Math.min(1, (s.t1 - t) / s.fout)); o *= q * q * (3 - 2 * q); }
    v.el.style.opacity = o;
    if (a > 0) { vis = Math.max(vis, o * (a >= 1 ? 1 : e)); if (a < 1 && shown) burn = Math.max(burn, Math.sin(Math.PI * a)); }
    const p = Math.max(0, Math.min(1, (t - s.t0) / (s.t1 - s.t0))), k = s.amp;
    v.bg.style.transform = 'scale(' + (1 + 0.05 * p).toFixed(4) + ')';   // фон движется медленнее фото — глубина
    const move = s.m % 4;
    let sc = 1 + k, tx = 0;
    if (move === 0) sc = 1 + k * p; else if (move === 1) sc = 1 + k * (1 - p);
    else tx = (p - 0.5) * k * 60 * (move === 2 ? 1 : -1);
    v.fg.style.transform = 'translateX(' + tx.toFixed(3) + '%) scale(' + sc.toFixed(4) + ')';
  });
  // картинка «дышит» на акцентах музыки; в первой части ещё и чуть дрожит, как старая плёнка
  const pulse = D.pulse[Math.min(D.pulse.length - 1, Math.floor(t * 10))] || 0;
  const bright = 1 + fx.pulse * pulse + fx.flicker * (Math.random() - .5) * (au.paused ? 0 : 1);
  stage.style.filter = 'saturate(' + interp(D.grade, t).toFixed(3) + ') sepia(.08) brightness(' + bright.toFixed(3) + ')';
  $('leak').style.opacity = (fx.leak * vis * (0.6 + 0.4 * Math.sin(t * 0.21)) * 2.2).toFixed(3);
  $('burn').style.opacity = (0.32 * burn).toFixed(3);
  drawDust(t, fx, vis);
  // разделитель части: цифра, название и линия, растущая из центра
  let cardA = 0;
  for (const c of D.cards) {
    const [c0, c1, c2, c3] = c.t;
    if (t > c0 && t < c3) {
      let q = Math.min(1, (t - c0) / (c1 - c0), (c3 - t) / (c3 - c2)); cardA = q * q * (3 - 2 * q);
      const cp = (t - c0) / (c3 - c0);
      document.querySelector('#card .num').textContent = c.num;
      document.querySelector('#card .name').textContent = c.text;
      document.querySelector('#card .ln').style.width = (Math.pow(Math.min(1, cp * 2.2), .6) * 32).toFixed(2) + 'vh';
      $('card').style.transform = 'translateY(' + (-1.2 * cp).toFixed(2) + 'vh)';
    }
  }
  $('card').style.opacity = cardA.toFixed(3);
  const tt = D.title.t;
  $('title').style.opacity = (t > tt[0] && t < tt[3]) ? Math.min(1, (t - tt[0]) / (tt[1] - tt[0]), (tt[3] - t) / (tt[3] - tt[2])) : 0;
  $('fill').style.width = (t / D.duration * 100) + '%';
  $('time').textContent = fmt(t);
  $('pp').textContent = au.paused ? '▶' : '❚❚';
  requestAnimationFrame(draw);
}

let uiTimer;
function showUI() { document.body.classList.add('ui'); clearTimeout(uiTimer);
  uiTimer = setTimeout(() => { if (!au.paused) document.body.classList.remove('ui'); }, 2500); }
const toggle = () => { au.paused ? au.play() : au.pause(); showUI(); };
function step(dir) {                      // листание: к началу следующего или предыдущего фото
  const t = au.currentTime, starts = D.slides.map(s => s.t0 + s.fin);
  let i = starts.findIndex(x => x > t + 0.05); if (i < 0) i = starts.length;
  const j = dir > 0 ? i : i - 2;
  au.currentTime = Math.max(0, starts[Math.max(0, Math.min(starts.length - 1, j))]); showUI();
}
$('go').onclick = () => { $('start').style.display = 'none'; au.currentTime = 0; au.play(); showUI(); };
stage.onclick = toggle; $('pp').onclick = toggle;
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
$('track').onclick = e => { const r = $('track').getBoundingClientRect();
  au.currentTime = Math.max(0, Math.min(D.duration - 0.2, (e.clientX - r.left) / r.width * D.duration)); };
addEventListener('mousemove', showUI);
addEventListener('keydown', e => {
  if ($('start').style.display !== 'none') return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight') step(1);
  if (e.code === 'ArrowLeft') step(-1);
  if (e.code === 'KeyF') $('fs').click();
});
au.onended = () => { $('start').style.display = 'flex'; $('go').textContent = 'Watch again'; };
requestAnimationFrame(draw);
</script>
